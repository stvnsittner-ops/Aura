<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Aura</title><style>*{box-sizing:border-box}body{background:#071323;color:#e5f9ff;font:16px system-ui;margin:0}main{max-width:600px;margin:auto;padding:24px 16px 100px}h1{letter-spacing:6px;color:#78eaff}article{background:#12283d;border:1px solid #28516c;border-radius:20px;padding:18px;margin:16px 0}button,input,select,textarea{font:inherit;background:#18364c;color:white;border:1px solid #39738e;border-radius:12px;padding:12px}input,select,textarea{width:100%;margin:5px 0}button{color:#87edff}nav{position:fixed;bottom:0;background:#102438;width:100%;display:flex;justify-content:center;gap:4px;padding:12px 4px calc(12px + env(safe-area-inset-bottom))}nav button{padding:12px 8px;font-size:14px}.orb{margin:35px auto;width:150px;height:150px;border:4px double #6eeaff;outline:2px dashed #3c91ad;outline-offset:9px;border-radius:50%;background:radial-gradient(circle,#b4ffff,#1878ac 35%,#071323 70%);box-shadow:0 0 45px #21beff55;display:grid;place-items:center;font-size:40px}.center{text-align:center}small,p{color:#a8c5d8}li{margin:12px 0;overflow-wrap:anywhere}li button{margin-left:8px}section[hidden]{display:none}</style></head><body><main><h1>AURA</h1><section id="home"><div class="orb">◉</div><h2 class="center">Hallo Stiven, wie kann ich dir heute helfen?</h2><button onclick="speak('Hallo Stiven, wie kann ich dir heute helfen?')">Begrüßung anhören</button><article><h2>Chat</h2><div id="chat"></div><form id="ask"><input id="q" required placeholder="Frag Aura …"><button>Senden</button> <button type="button" onclick="listen()">Mikrofon</button></form><small>Lokaler Assistent – noch keine echte KI.</small></article><article><h2>Tagesbriefing</h2><p id="brief"></p></article></section><section id="finance" hidden><h2>Finanzen</h2><article id="summary"></article><article><form id="book"><select id="kind"><option>Ausgabe</option><option>Einnahme</option></select><input id="desc" required placeholder="Beschreibung"><input id="amount" type="number" min=".01" step=".01" required placeholder="Euro"><button>Speichern</button></form><ul id="books"></ul></article></section><section id="plan" hidden><h2>Wochenplaner</h2><article><form id="taskform"><input id="task" required placeholder="Aufgabe"><input id="due" type="date"><button>Hinzufügen</button></form><ul id="tasks"></ul></article><article><textarea id="note" placeholder="Notizen" rows="5"></textarea><button onclick="save()">Notizen speichern</button></article></section><section id="stocks" hidden><h2>Aktien-Watchlist</h2><article><form id="watchform"><input id="ticker" required placeholder="Aktienkürzel"><button>Hinzufügen</button></form><ul id="watch"></ul><p>Livekurse, Analysen und Kursalarme sind noch nicht verbunden.</p></article></section></main><nav><button onclick="show('home')">Aura</button><button onclick="show('finance')">Finanzen</button><button onclick="show('plan')">Planer</button><button onclick="show('stocks')">Aktien</button></nav><script>const $=id=>document.getElementById(id);let s={books:[],tasks:[],watch:['SAP','MSFT'],note:''};try{s={...s,...JSON.parse(localStorage.getItem('aura-v2')||'{}')}}catch(e){}$('note').value=s.note;function save(){s.note=$('note').value;try{localStorage.setItem('aura-v2',JSON.stringify(s))}catch(e){alert('Speichern nicht möglich')}}function show(id){document.querySelectorAll('section').forEach(x=>x.hidden=x.id!==id)}const eur=n=>(n/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});function totals(){let i=0,o=0;s.books.forEach(x=>x.kind==='Einnahme'?i+=x.cents:o+=x.cents);return 'Einnahmen: '+eur(i)+' · Ausgaben: '+eur(o)+' · Saldo: '+eur(i-o)}function row(id,t,label,fn){let li=document.createElement('li'),b=document.createElement('button');li.textContent=t;b.textContent=label;b.onclick=()=>{fn();save();render()};li.append(b);$(id).append(li)}function render(){$('summary').textContent=totals();$('brief').textContent=s.tasks.filter(x=>!x.done).length+' offene Aufgaben. Plane deine wichtigste Aufgabe zuerst. '+totals();['books','tasks','watch'].forEach(x=>$(x).replaceChildren());s.books.forEach((x,j)=>row('books',x.desc+' '+x.kind+' '+eur(x.cents),'Löschen',()=>s.books.splice(j,1)));s.tasks.forEach((x,j)=>row('tasks',(x.done?'✓ ':'')+x.text+' '+x.due,x.done?'Öffnen':'Erledigt',()=>x.done=!x.done));s.watch.forEach((x,j)=>row('watch',x,'Entfernen',()=>s.watch.splice(j,1)))}$('book').onsubmit=e=>{e.preventDefault();let cents=Math.round(Number($('amount').value)*100);if(!Number.isSafeInteger(cents)||cents<=0)return;s.books.push({kind:$('kind').value,desc:$('desc').value,cents});save();render();e.target.reset()};$('taskform').onsubmit=e=>{e.preventDefault();s.tasks.push({text:$('task').value,due:$('due').value,done:false});save();render();e.target.reset()};$('watchform').onsubmit=e=>{e.preventDefault();let t=$('ticker').value.trim().toUpperCase();if(t&&!s.watch.includes(t))s.watch.push(t);save();render();e.target.reset()};function speak(t){if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.cancel();speechSynthesis.speak(u)}}function talk(){let q=$('q').value.trim();if(!q)return;let a=/geld|saldo|finanz|ausgaben|einnahmen|spar/i.test(q)?totals():/woche|aufgabe|plan/i.test(q)?$('brief').textContent:'Für freie Gespräche benötige ich noch eine KI-Anbindung.';for(let t of ['Du: '+q,'Aura: '+a]){let p=document.createElement('p');p.textContent=t;$('chat').append(p)}speak(a);$('q').value=''}$('ask').onsubmit=e=>{e.preventDefault();talk()};function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('q').focus();alert('Nutze das Mikrofon der iPhone-Tastatur.');return}try{let r=new R();r.lang='de-DE';r.onresult=e=>{$('q').value=e.results[0][0].transcript;talk()};r.onerror=()=>alert('Nutze die Tastatur-Diktierfunktion.');r.start()}catch(e){alert('Mikrofon nicht verfügbar')}}render()</script></body></html>
