<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020611"><title>Aura · Finanzen</title><style>*{box-sizing:border-box}body{margin:0;padding:18px 14px 50px;background:#020611;color:#e4faff;font:16px system-ui,-apple-system,sans-serif}header{max-width:1000px;margin:0 auto 24px;display:flex;align-items:center;justify-content:space-between;gap:10px}header strong{letter-spacing:7px;color:#67e6ff;font-size:23px;text-shadow:0 0 16px #00aaff}header a{color:#7fe9ff;text-decoration:none;border:1px solid #3bd5ff80;padding:12px;border-radius:10px}main{max-width:1000px;margin:auto}h2,h3{color:#d9f7ff}article{background:#081827;border:1px solid #3bd5ff66;border-radius:18px;padding:18px;margin:16px 0}button,select,input{font:inherit;background:#071c2c;border:1px solid #36b6e1;border-radius:10px;color:#e4faff;padding:12px;max-width:100%}button{cursor:pointer;color:#8eefff}label{display:block}label input,label select{display:block;margin-top:6px}p{color:#a8c5d8}#finance .financeWide{margin:12px 0;min-width:0}#finance .finTop{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}#finance .finTop>*{flex:1;min-width:120px}#finance .finMonths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#finance .finMonthCard{background:linear-gradient(140deg,#0b293b,#061421);border:1px solid #247b9c88;border-radius:12px;padding:12px;text-align:left;min-width:0;cursor:pointer;color:inherit}#finance .finMonthCard.active{border:2px solid #50e4ff;box-shadow:0 0 14px #14bfff44}#finance .finMonthCard strong{display:block;margin-bottom:7px;color:#9de9ff}#finance .finMoney,#finance .finPositive{color:#42e6a0!important;font-weight:700;font-variant-numeric:tabular-nums}#finance .finNegative{color:#ff5d70!important;font-weight:700;font-variant-numeric:tabular-nums}#finance .finMetric{padding:12px;border:1px solid #238ab877;border-radius:10px;background:#061b2b;margin:7px 0}#finance .finMetric strong{display:block;font-size:clamp(17px,4vw,26px)}#finance .finEntry{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #27799766;padding:9px 0}#finance .finEntry span{flex:1;min-width:120px}#finance .finEntry button{flex:0 0 auto}#finance .finBar{height:9px;border-radius:9px;background:#102f42;overflow:hidden;margin:6px 0 12px}#finance .finBar>div{height:100%;background:linear-gradient(90deg,#1a91c0,#46e6a6)}#finance #finForm{display:grid;gap:10px}#finance #finForm label{display:block}#finance #finForm input,#finance #finForm select{width:100%}@media(min-width:650px){#finance .finMonths{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><strong>AURA</strong><a href="./?v=82">← Zurück zu Aura</a></header><main><section id="finance"><h2>FINANZEN / JAHRESÜBERSICHT</h2><article class="financeWide"><div class="finTop"><label>Jahr <select id="finYear" onchange="renderFinance()"></select></label><button type="button" onclick="exportFinance()">Jahresdaten exportieren</button></div><div id="finAnnual"></div><div id="finRecovery"></div><h3>DEINE 12 MONATE</h3><div id="finMonths" class="finMonths"></div></article><article class="financeWide"><h3 id="finMonthTitle">MONAT BEARBEITEN</h3><p class="muted">Einträge gelten nur für den ausgewählten Monat. Mit „Vormonat übernehmen“ kopierst du wiederkehrende Posten und kannst sie einzeln ändern.</p><div class="finTop"><select id="finMonthSelect" onchange="selectFinanceMonth(this.value)"></select><button type="button" onclick="copyFinancePrevious()">Vormonat übernehmen</button></div><form id="finForm" onsubmit="event.preventDefault();saveFinanceEntry()"><input id="finEditId" type="hidden"><label>Art<select id="finKind" onchange="updateFinanceCategory()"><option>Einnahme</option><option>Ausgabe</option></select></label><label>Kategorie<select id="finCategory"></select></label><label>Bezeichnung<input id="finDesc" required maxlength="100" placeholder="z. B. Miete, Gehalt, Einkaufen"></label><label>Betrag in €<input id="finAmount" type="number" min="0.01" step="0.01" required placeholder="0,00"></label><div class="finTop"><button id="finSaveBtn">Eintrag speichern</button><button type="button" onclick="resetFinanceEntry()">Abbrechen / Neu</button></div></form><div id="finEntries"></div></article><article class="financeWide"><h3>AUSGABEN / KATEGORIEN</h3><div id="finCategories"></div><h3>SPARPOTENZIAL / JAHRESVERGLEICH</h3><div id="finInsights"></div></article></section></main><script>const $=id=>document.getElementById(id);let s={books:[]};try{s={...s,...JSON.parse(localStorage.getItem('aura-v2')||'{}')}}catch{};// Finance ledger v3: monthly entries, explicit copying, no automatic cross-month mutation.
const finNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const finCategoriesOut=['Wohnen','Lebensmittel','Mobilität','Versicherungen','Freizeit','Abos','Gesundheit','Shopping','Reisen','Sonstiges'];
const finCategoriesIn=['Gehalt','Nebenverdienst','Erstattung','Sonstiges'];
const finNow=new Date();let finYear=finNow.getFullYear(),finMonth=finNow.getMonth(),finData={};
try{const parsed=JSON.parse(localStorage.getItem('aura-finance-v3')||'{}');if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))finData=parsed}catch{}
// Import existing simple ledger once into the current month, without deleting its original copy.
if(!localStorage.getItem('aura-finance-v3-migrated')){const old=Array.isArray(s.books)?s.books:[];if(old.length){const key=finKey(finYear,finMonth);finData[key]=[...(Array.isArray(finData[key])?finData[key]:[]),...old.filter(x=>Number.isSafeInteger(x.cents)&&x.cents>0).map((x,i)=>({id:'legacy-'+i,kind:x.kind==='Einnahme'?'Einnahme':'Ausgabe',desc:String(x.desc||'Früherer Eintrag'),category:'Sonstiges',cents:x.cents}))];try{localStorage.setItem('aura-finance-v3',JSON.stringify(finData));localStorage.setItem('aura-finance-v3-migrated','1')}catch{}}else try{localStorage.setItem('aura-finance-v3-migrated','1')}catch{}}
function persistFinance(){try{localStorage.setItem('aura-finance-v3',JSON.stringify(finData));return true}catch{alert('Finanzdaten konnten nicht gespeichert werden. Bitte Speicherplatz prüfen.');return false}}
function finKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function finEntries(y=finYear,m=finMonth){const x=finData[finKey(y,m)];return Array.isArray(x)?x:[]}
function finTotals(rows){return rows.reduce((a,x)=>{if(x.kind==='Einnahme')a.inc+=x.cents;else a.out+=x.cents;return a},{inc:0,out:0})}
function finEuro(c){return (c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function finNode(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function updateFinanceCategory(){const sel=$('finCategory'),prev=sel.value;sel.replaceChildren();for(const x of $('finKind').value==='Einnahme'?finCategoriesIn:finCategoriesOut)sel.add(new Option(x,x));if([...sel.options].some(o=>o.value===prev))sel.value=prev}
function resetFinanceEntry(){$('finEditId').value='';$('finForm').reset();updateFinanceCategory();$('finSaveBtn').textContent='Eintrag speichern'}
function selectFinanceMonth(v){finMonth=Number(v);resetFinanceEntry();renderFinance()}
function saveFinanceEntry(){const desc=$('finDesc').value.trim(),kind=$('finKind').value,category=$('finCategory').value,cents=Math.round(Number($('finAmount').value)*100);if(!desc||!Number.isSafeInteger(cents)||cents<=0||cents>100000000000)return;const key=finKey(finYear,finMonth),old=finEntries().slice(),id=$('finEditId').value||String(Date.now())+'-'+Math.random().toString(36).slice(2),item={id,desc,kind,category,cents};const idx=old.findIndex(x=>x.id===id);if(idx<0)old.push(item);else old[idx]=item;finData[key]=old;if(persistFinance()){resetFinanceEntry();renderFinance()}}
function editFinanceEntry(id){const x=finEntries().find(x=>x.id===id);if(!x)return;$('finEditId').value=id;$('finKind').value=x.kind;updateFinanceCategory();$('finCategory').value=x.category;$('finDesc').value=x.desc;$('finAmount').value=(x.cents/100).toFixed(2);$('finSaveBtn').textContent='Änderung speichern';$('finDesc').focus()}
function deleteFinanceEntry(id){if(!confirm('Eintrag wirklich löschen?'))return;const key=finKey(finYear,finMonth);finData[key]=finEntries().filter(x=>x.id!==id);if(persistFinance())renderFinance()}
function copyFinancePrevious(){const previous=new Date(finYear,finMonth-1,1),source=finEntries(previous.getFullYear(),previous.getMonth());if(!source.length){alert('Im Vormonat gibt es keine Einträge.');return}const existing=finEntries();if(existing.length&&!confirm('Vorhandene Einträge bleiben bestehen. Vormonat zusätzlich übernehmen?'))return;const next=existing.slice();let count=0;for(const x of source){if(next.some(y=>y.kind===x.kind&&y.category===x.category&&y.desc.toLowerCase()===x.desc.toLowerCase()))continue;next.push({...x,id:String(Date.now())+'-'+count+'-'+Math.random().toString(36).slice(2)});count++}finData[finKey(finYear,finMonth)]=next;if(persistFinance()){renderFinance();alert(count+' Einträge übernommen. Alle Beträge sind individuell änderbar.')}}
function restoreOldFinance(){const old=Array.isArray(s.books)?s.books:[];if(!old.length){alert('Auf diesem Gerät wurden keine alten Einträge gefunden. Bitte Aura im selben Browser wie zuvor öffnen.');return}const key=finKey(finYear,finMonth),next=finEntries().slice();let added=0;for(let i=0;i<old.length;i++){const x=old[i];if(!Number.isSafeInteger(x.cents)||x.cents<=0)continue;const id='legacy-'+i;if(next.some(y=>y.id===id))continue;next.push({id,kind:x.kind==='Einnahme'?'Einnahme':'Ausgabe',desc:String(x.desc||'Alter Eintrag'),category:'Sonstiges',cents:x.cents});added++}finData[key]=next;if(persistFinance()){renderFinance();alert(added+' alte Einträge wiederhergestellt.')}}
function renderFinance(){const yearSel=$('finYear');yearSel.replaceChildren();const years=new Set([finNow.getFullYear()-1,finNow.getFullYear(),finNow.getFullYear()+1,finYear,...Object.keys(finData).map(x=>Number(x.slice(0,4)))]);for(const y of [...years].filter(Number.isInteger).sort((a,b)=>b-a))yearSel.add(new Option(y,y));yearSel.value=String(finYear);const monthSel=$('finMonthSelect');monthSel.replaceChildren();finNames.forEach((x,i)=>monthSel.add(new Option(x,i)));monthSel.value=String(finMonth);$('finMonthTitle').textContent=finNames[finMonth].toUpperCase()+' '+finYear+' / BUCHUNGEN';const all=Array.from({length:12},(_,m)=>finTotals(finEntries(finYear,m))),total=all.reduce((a,x)=>({inc:a.inc+x.inc,out:a.out+x.out}),{inc:0,out:0}),annual=$('finAnnual');annual.replaceChildren();const metrics=[['JAHRESEINNAHMEN',total.inc,'finMoney'],['JAHRESAUSGABEN',total.out,'finNegative'],['JAHRESSALDO',total.inc-total.out,total.inc>=total.out?'finPositive':'finNegative'],['SPARQUOTE',total.inc?Math.round((total.inc-total.out)/total.inc*1000)/10+' %':'–',total.inc>=total.out?'finPositive':'finNegative']];for(const [label,val,cls] of metrics){const box=finNode('div',label,'finMetric');box.append(finNode('strong',typeof val==='number'?finEuro(val):val,cls));annual.append(box)}const recoveryBox=$('finRecovery');recoveryBox.replaceChildren();const legacy=Array.isArray(s.books)?s.books:[];if(legacy.length){const p=finNode('p','Frühere Finanzdaten erkannt: '+legacy.length+' Einträge.');const b=finNode('button','Alte Einträge wiederherstellen');b.type='button';b.onclick=restoreOldFinance;recoveryBox.append(p,b)}else if(!Object.values(finData).some(x=>Array.isArray(x)&&x.length)){recoveryBox.append(finNode('p','Noch keine gespeicherten Finanzdaten auf diesem Gerät gefunden. Falls du früher etwas eingetragen hast, öffne Aura im gleichen Browser und auf demselben Gerät.'))}const months=$('finMonths');months.replaceChildren();finNames.forEach((name,m)=>{const t=all[m],card=finNode('button',name,'finMonthCard'+(m===finMonth?' active':''));card.type='button';card.append(finNode('small','Einnahmen: '+finEuro(t.inc),'finMoney'),document.createElement('br'),finNode('small','Ausgaben: '+finEuro(t.out),'finNegative'),document.createElement('br'),finNode('small','Saldo: '+finEuro(t.inc-t.out),t.inc>=t.out?'finPositive':'finNegative'));card.onclick=()=>selectFinanceMonth(m);months.append(card)});const entries=$('finEntries');entries.replaceChildren();const rows=finEntries();if(!rows.length)entries.append(finNode('p','Noch keine Einträge für diesen Monat.'));rows.forEach(x=>{const row=finNode('div','','finEntry'),info=finNode('span',x.desc+' · '+x.category+' · '+x.kind),money=finNode('strong',finEuro(x.cents),x.kind==='Ausgabe'?'finNegative':'finMoney');row.append(info,money);for(const [label,fn] of [['Ändern',()=>editFinanceEntry(x.id)],['Löschen',()=>deleteFinanceEntry(x.id)]]){const b=finNode('button',label);b.type='button';b.onclick=fn;row.append(b)}entries.append(row)});const groups=new Map();for(let m=0;m<12;m++)for(const x of finEntries(finYear,m))if(x.kind==='Ausgabe')groups.set(x.category,(groups.get(x.category)||0)+x.cents);const cat=$('finCategories');cat.replaceChildren();if(!total.out)cat.append(finNode('p','Noch keine Ausgaben für die Prozentanalyse.'));for(const [name,sum] of [...groups].sort((a,b)=>b[1]-a[1])){const percent=sum/total.out*100;cat.append(finNode('p',name+' · '+finEuro(sum)+' · '+percent.toFixed(1).replace('.',',')+' %'));const bar=finNode('div','','finBar'),fill=finNode('div');fill.style.width=percent+'%';bar.append(fill);cat.append(bar)}const insights=$('finInsights');insights.replaceChildren();const active=all.filter(x=>x.inc||x.out);if(active.length){insights.append(finNode('p','Erfasste Monate: '+active.length+' von 12 · Ø Ausgaben je erfasstem Monat: '+finEuro(Math.round(total.out/active.length))));const top=[...groups].sort((a,b)=>b[1]-a[1])[0];if(top)insights.append(finNode('p','Größter Ausgabenbereich: '+top[0]+' ('+(top[1]/total.out*100).toFixed(1).replace('.',',')+' %). Hier lohnt sich eine genauere Prüfung.'));const savings=all.map((t,m)=>({m,value:t.inc-t.out})).filter(x=>all[x.m].inc||all[x.m].out).sort((a,b)=>a.value-b.value);if(savings.length)insights.append(finNode('p','Niedrigster Monatssaldo: '+finNames[savings[0].m]+' ('+finEuro(savings[0].value)+').'));}else insights.append(finNode('p','Nach deinen ersten Einträgen zeigt Aura hier Sparpotenziale.')); }
function exportFinance(){const rows=[['Jahr','Monat','Art','Kategorie','Bezeichnung','Betrag EUR']];for(let m=0;m<12;m++)for(const x of finEntries(finYear,m))rows.push([finYear,finNames[m],x.kind,x.category,x.desc,(x.cents/100).toFixed(2).replace('.',',')]);const csv='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Aura-Finanzen-'+finYear+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('finYear').onchange=e=>{finYear=Number(e.target.value);resetFinanceEntry();renderFinance()};resetFinanceEntry();renderFinance();
</script></body></html>
